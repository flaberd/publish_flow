; Production overrides for PHP-FPM. Mounted at
; /usr/local/etc/php/conf.d/99-app.ini so it loads after the image defaults.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

memory_limit = 256M

; Video uploads: tune these to the real max file size the app accepts, and
; keep nginx's client_max_body_size (docker/nginx/conf.d/app.conf) in sync —
; nginx sits in front of PHP-FPM and will reject oversized bodies first.
upload_max_filesize = 1024M
post_max_size = 1024M
max_execution_time = 300
max_input_time = 300

; OPcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Application containers are disposable and rebuilt on every deploy, so a
; stale opcode cache never outlives the code it compiled from — safe to skip
; the per-request mtime check.
opcache.validate_timestamps = 0

date.timezone = UTC
