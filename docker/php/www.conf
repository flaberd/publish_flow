; Production PHP-FPM pool overrides, loaded after the image's default pool
; config (zz- prefix ensures it's read last and wins).

[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data

; Required so the environment variables docker compose injects via env_file
; (DB_*, APP_KEY, VIDEO_STORAGE_PATH, ...) actually reach PHP-FPM workers.
; FPM strips almost the entire environment by default; without this, Laravel
; would see none of the runtime configuration.
clear_env = no

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
