# Production server block. Replace `example.com` with the real domain and
# point ssl_certificate(_key) at the certs placed on the EC2 host (see
# docs/deployment.md for the certbot flow). This file is mounted from the
# EC2 host, not baked into the nginx image, so domain/TLS changes never
# require a rebuild.

# Plain HTTP: only used for the ACME http-01 challenge and to redirect
# everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/nginx/ssl/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/html/public;
    index index.php;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never serve dotfiles (.env, .git, ...) even if one ends up in the
    # webroot by mistake.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|eot|ico)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
