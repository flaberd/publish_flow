name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Existing image tag to deploy without rebuilding (rollback). Must
          already exist in GHCR, e.g. sha-abc1234. Leave empty to build and
          deploy the current commit as usual.
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_IMAGE_REPO: ghcr.io/${{ github.repository }}/app
  NGINX_IMAGE_REPO: ghcr.io/${{ github.repository }}/nginx

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.image_tag == '' }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every production dependency/build step (composer install --no-dev,
      # npm ci, npm run build) happens inside these Docker builds, entirely
      # on the GitHub Actions runner — never on EC2, and `composer update`
      # is never invoked anywhere in this pipeline.
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.APP_IMAGE_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ env.APP_IMAGE_REPO }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: true
          tags: |
            ${{ env.NGINX_IMAGE_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ env.NGINX_IMAGE_REPO }}:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || github.event.inputs.image_tag != '') }}
    steps:
      - name: Resolve image tag
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ needs.build.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ env.APP_IMAGE_REPO }}:${{ steps.resolve.outputs.tag }}
          NGINX_IMAGE: ${{ env.NGINX_IMAGE_REPO }}:${{ steps.resolve.outputs.tag }}
          DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH || '/opt/publish-flow' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: APP_IMAGE,NGINX_IMAGE,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # Rollback for this project doesn't need to be instant (see
            # docs/deployment.md, "Rollback strategy") — GHCR keeps every
            # sha-<commit> tag forever, so an older tag can always be
            # re-pulled (or the commit rebuilt) on demand. That means the
            # EC2 host has no reason to hoard every image it has ever
            # pulled, so prune anything no running container currently
            # uses right before pulling the new one, to keep the host's
            # disk from silently filling up over time.
            docker image prune -af

            # .deploy.env only records which image tags are currently
            # deployed (not a secret) — it is separate from the persistent
            # .env file, which this script never touches, reads or writes.
            cat > .deploy.env <<ENVFILE
            APP_IMAGE=${APP_IMAGE}
            NGINX_IMAGE=${NGINX_IMAGE}
            ENVFILE

            docker compose --env-file .deploy.env pull
            docker compose --env-file .deploy.env up -d

            # Wait for the app container to actually be ready to run artisan
            # before running migrations (mysql readiness is already gated by
            # its compose healthcheck via depends_on).
            for i in $(seq 1 10); do
              if docker compose --env-file .deploy.env exec -T app php artisan --version > /dev/null 2>&1; then
                break
              fi
              sleep 3
            done

            # Retried on top of the healthcheck/depends_on gate, not instead
            # of it: on a first-ever deploy against a brand-new mysql volume,
            # MySQL's own healthcheck can briefly report healthy before the
            # real, TCP-listening server replaces its bootstrap instance,
            # which previously made this fail immediately with "Connection
            # refused" on a fresh deploy.
            for i in $(seq 1 10); do
              if docker compose --env-file .deploy.env exec -T app php artisan migrate --force; then
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "migrate --force failed after 10 attempts" >&2
                exit 1
              fi
              sleep 5
            done

            docker compose --env-file .deploy.env exec -T app php artisan optimize

            # Deliberately nothing else here: no `down`, no `-v`. Image
            # cleanup already happened above, before the pull; nothing
            # about the running containers, volumes or the database is
            # ever touched by this pipeline.
